<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
    :root {
      color-scheme: dark;
    }

    body {
      width: 480px;
      padding: 14px;
      margin: 0;
      font:
        13px / 1.4 system-ui,
        sans-serif;
      background-color: oklch(17.764% 0.00002 271.152);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      opacity: 0.7;
    }

    select,
    button {
      box-sizing: border-box;
      width: 100%;
      font: inherit;
    }

    select {
      padding: 5px;
      margin-bottom: 10px;
    }

    button {
      padding: 8px;
      margin-top: 6px;
      color: inherit;
      cursor: pointer;
      background: none;
      border: 1px solid currentColor;
      border-radius: 6px;
    }

    button.primary {
      color: #fff;
      background: oklch(41.922% 0.27746 267.149);
      border-color: oklch(43.684% 0.28628 265.1);
    }

    button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    #status {
      min-height: 1.4em;
      margin: 10px 0 0;
      font-size: 12px;
    }

    #collection-status {
      min-height: 1.4em;
      margin: 10px 0 0;
      font-size: 12px;
    }

    #collection-status[data-bad],
    #status[data-bad] {
      color: #c0392b;
    }
    </style>
  </head>

  <body>
    <h1>
      Capture to board
      <small id="version" style="font-weight:400;opacity:.55"></small>
    </h1>
    <label for="board">Board</label>
    <select id="board"></select>
    <button class="primary" id="whole" type="button">Whole page</button>
    <button id="view" type="button">What's on screen</button>
    <p id="status" role="status"></p>
    <hr style="margin:14px 0;border:0;border-top:1px solid #ffffff22">
    <h1>Save images to a collection</h1>
    <label for="collection"
      >Right-click any image → Save image to collection. First in the
      menu:</label
    >
    <select id="collection"></select>
    <button id="refresh" type="button">Refresh collections</button>
    <p id="collection-status" role="status"></p>
    <script defer src="popup.js"></script>
  </body>
</html>
