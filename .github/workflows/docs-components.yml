name: Docs components

# Rebuilds the docs site's Components tab from the brand kits, so a kit's
# component styles show up in the docs without anyone running a script.
# Reads the public feed on www.dallaspeters.com (/api/brand-kits?docs=components)
# scans each component for accessibility (axe-core in Chromium), and commits
# only when a page changed; Mintlify deploys from that commit.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-components
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The accessibility scan needs Playwright and axe-core, so the app's
      # dependencies are installed as in CI (Hugeicons Pro needs its token).
      - run: pnpm config set //npm.hugeicons.com/:_authToken "$HUGEICONS_TOKEN"
        env:
          HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for the accessibility scan
        run: pnpm exec playwright install --with-deps chromium

      - run: node scripts/docs-components.mjs

      - name: Commit changed pages
        run: |
          git add docs/site
          if git diff --cached --quiet; then
            echo "No component changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update brand kit components"
          git push
