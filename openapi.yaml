info:
  description: Generated from the handlers in `api/` and the schemas in `schemas/`. Do not edit by hand — run `pnpm openapi`.
  title: Photo portfolio API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/ai/generate:
    post:
      description: The result is copied to our own blob host before returning — fal serves from a temporary location that would expire under the board.
      operationId: post_api_ai_generate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        4XX:
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
      summary: Generate an image from a prompt, optionally from a source image.
      tags:
        - ai
  /api/ai/icon-webhook:
    post:
      description: Called by fal, not by the app. Authenticated by the signature on the request rather than a bearer token.
      operationId: post_api_ai_icon-webhook
      responses:
        "200":
          description: Success
        4XX:
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
      summary: Delivery callback for a queued icon generation.
      tags:
        - ai
  /api/ai/icon:
    post:
      operationId: post_api_ai_icon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  minLength: 1
                style:
                  type: string
              required:
                - prompt
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        4XX:
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
      summary: Generate an SVG icon.
      tags:
        - ai
  /api/auth/change-password:
    post:
      operationId: post_api_auth_change-password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
              required:
                - currentPassword
                - newPassword
              additionalProperties: false
      responses:
        "200":
          description: Success
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        4XX:
          description: Request rejected
          content:
