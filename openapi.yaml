        5XX:
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
      summary: Change the signed-in user's password.
      tags:
        - auth
  /api/auth/forgot-password:
    post:
      description: Always answers 200, whether or not the address is known — a different answer would confirm which addresses have accounts.
      operationId: post_api_auth_forgot-password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Success
        4XX:
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
      summary: Send a reset link.
      tags:
        - auth
  /api/auth/google:
    post:
      operationId: post_api_auth_google
      requestBody:
        required: true
